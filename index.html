<form>

<!-- Email -->
 <input id="email" type="text" name="email" placeholder="Email">
<!-- Password -->
 <input id="password" type="text" name="password" placeholder="Password">
<!-- Github Username -->
 <input id="username" type="text" name="username" placeholder="Github Username">
<!-- Radio buttons with the following options: Enterprise, Pro, Free -->

  <fieldset>
    <legend>Which Version?</legend>
    <input id="programversion" type="radio" name="version" value="Enterprise">
    <label for="programversion-1">Enterprise</label><br>

    <input id="programversion" type="radio" name="version" value="Pro">
    <label for="programversion-2">Pro</label><br>

    <input id="programversion" type="radio" name="version" value="New Free">
    <label for="programversion-3">Free</label><br>
  </fieldset>

<!-- A checkbox with the words "Remember Me" next to it. -->
  <fieldset>
    <input id="exercise" type="checkbox" name="remember" value="Remember Me">
    <label for="exercise">Remember Me</label><br>
  </fieldset>

</form>
